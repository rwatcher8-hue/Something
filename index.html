<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shadow Chef</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="game-shell">
    <h1>👻 Shadow Chef</h1>
    <div class="hud">
      <div class="panel"><strong>Time:</strong> <span id="time">75</span>s</div>
      <div class="panel"><strong>Score:</strong> <span id="score">0</span></div>
      <div class="panel"><strong>Recipes:</strong> <span id="recipesDone">0</span></div>
    </div>
    <div class="recipe-box">
      <strong>Current Recipe Order:</strong>
      <ol id="recipeList"></ol>
    </div>
    <canvas id="game" width="960" height="600" aria-label="Shadow Chef game area"></canvas>
    <div id="overlay" class="overlay hidden"></div>
    <p class="controls">Use arrow keys to float through the haunted kitchen and gather ingredients in order.</p>
  </div>
  <script src="game.js"></script>
</body>
</html>
